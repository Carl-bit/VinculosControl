# Host A: plano de control (CONTEXTO.md, seccion 1). Hoy en el PC de desarrollo;
# despues en el host que deje libre el VPS de los silos (siempre separado del host B).
#
#   cp infra/host-a/.env.example infra/host-a/.env   # y completar
#   docker compose -f infra/host-a/docker-compose.yml --env-file infra/host-a/.env up -d --build
#   docker compose -f infra/host-a/docker-compose.yml --env-file infra/host-a/.env exec api node dist/cli/crear-agente.js host-b
#
# La API se publica en la red (el agente del host B la llama). La consola (web)
# solo en 127.0.0.1: para verla desde afuera, cloudflared + Cloudflare Access.

name: vinculos-control

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: control
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:?CONTROL_DB_PASSWORD es obligatoria}
      POSTGRES_DB: control
    volumes:
      - db_control:/var/lib/postgresql
    ports:
      # Solo para correr la API en modo desarrollo desde el host (pnpm api dev).
      - '127.0.0.1:5440:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U control -d control']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://control:${CONTROL_DB_PASSWORD}@db:5432/control
      CONSOLA_SECRETO: ${CONSOLA_SECRETO:?CONSOLA_SECRETO es obligatoria}
      LANDING_SECRETO: ${LANDING_SECRETO:?LANDING_SECRETO es obligatoria}
      # Direccion publica de la landing (alli vive el enlace de fase 2 que arma la API) y dominio
      # base de los subdominios de los silos.
      LANDING_URL: ${LANDING_URL:-http://127.0.0.1:3300}
      DOMINIO_BASE: ${DOMINIO_BASE:-vinculos.cl}
      SALUD_INTERVALO_S: ${SALUD_INTERVALO_S:-60}
      TZ: America/Santiago
      # Feriados puntuales o regionales (YYYY-MM-DD, separados por coma) para los dias habiles
      # de los incidentes. Los de ley se calculan solos (apps/api/src/incidentes/feriados.ts).
      FERIADOS_EXTRA: ${FERIADOS_EXTRA:-}
      # Codigo del login. Local: Mailpit; produccion: SMTP de SES (587 + usuario/clave) y su configuration set.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PUERTO: ${SMTP_PUERTO:-1025}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:-vinculos-control <consola@vinculos.local>}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
    ports:
      - '${API_PUERTO:-4000}:4000'
    # La API es la unica que esta en las dos redes: la landing la alcanza a ella y a nada mas
    # (ni la base, ni la consola, ni Mailpit).
    networks:
      - default
      - landing

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:4000
      CONSOLA_SECRETO: ${CONSOLA_SECRETO}
      # Direccion publica de la landing (para el enlace que comparte el operador).
      LANDING_URL: ${LANDING_URL:-http://127.0.0.1:3300}
    ports:
      - '127.0.0.1:${WEB_PUERTO:-3100}:3000'

  # Landing publica (apps/landing): unico sitio publico del plano de control. La pagina para
  # vender Vinculos, la solicitud del centro (tambien por el enlace que comparte el operador,
  # ?via=enlace) y el enlace privado de fase 2 (/manifiesto/<token>). Red propia y secreto
  # propio; solo llega a /landing/* de la API. En pruebas, 127.0.0.1:3300; publicarla (tunel de
  # Cloudflare) es un paso de infra.
  landing:
    build:
      context: ../..
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:4000
      LANDING_SECRETO: ${LANDING_SECRETO}
    ports:
      - '127.0.0.1:${LANDING_PUERTO:-3300}:3000'
    networks:
      - landing

  # Correo local del login (codigos de acceso). Puertos distintos a los del Mailpit del ERP (1025/8025).
  # En produccion no se levanta: SMTP_HOST apunta a SES.
  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - '127.0.0.1:8026:8025'
      - '127.0.0.1:1026:1025'

volumes:
  db_control:

networks:
  # db, api, web y mailpit.
  default:
  # api <-> landing: el sitio publico solo ve a la API.
  landing:
