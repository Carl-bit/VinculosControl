# CI del plano de control (Bitbucket Pipelines).
#
# Corre en cada push y en cada pull request:
#   1. instalacion con el lockfile (pnpm 10, Node 22, como los Dockerfile);
#   2. tests de todos los paquetes (`pnpm -r test`: API sin Docker, agente,
#      ejecutor, manifiesto);
#   3. tests de integracion de la API contra Postgres 18 como servicio
#      (TEST_DATABASE_URL: el globalSetup no levanta contenedor, aplica todas
#      las migraciones desde cero sobre la base vacia);
#   4. tipos de web y landing, y build de api, agente, ejecutor, web y landing.
#
# Fuera por ahora: publicar imagenes en el registro privado del host B. Depende
# de R1 (imagenes por digest) y de como llega CI al host B, que no abre puertos
# (decision abierta, docs/roadmap.md).

image: node:22-bookworm-slim

definitions:
  caches:
    pnpm: $BITBUCKET_CLONE_DIR/.pnpm-store
  services:
    postgres:
      image: postgres:18-alpine
      memory: 512
      variables:
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
        POSTGRES_DB: control_test
  steps:
    - step: &verificar
        name: Tests, integracion y build
        size: 2x
        caches:
          - pnpm
        services:
          - postgres
        script:
          - apt-get update -qq && apt-get install -y -qq openssl ca-certificates > /dev/null
          - corepack enable && corepack prepare pnpm@10.12.1 --activate
          - pnpm config set store-dir $BITBUCKET_CLONE_DIR/.pnpm-store
          - pnpm install --frozen-lockfile
          - pnpm --filter @vc/api exec prisma generate
          # API y agente importan @vinculos/manifest desde su dist: compilarlo antes de los tests.
          - pnpm manifest build
          - pnpm -r test
          - TEST_DATABASE_URL=postgresql://test:test@127.0.0.1:5432/control_test pnpm api test:int
          - pnpm --filter @vc/web exec tsc --noEmit
          - pnpm --filter @vc/landing exec tsc --noEmit
          - pnpm -r build

pipelines:
  default:
    - step: *verificar
  pull-requests:
    '**':
      - step: *verificar
